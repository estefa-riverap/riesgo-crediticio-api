[project]
name = "riesgo-credito"
version = "0.1.0"
description = "API para estimar la probabilidad de incumplimiento de una solicitud de crédito"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pandas>=2.2",
    # Versión fija: el modelo guardado en models/ debe cargarse con la misma
    # versión de scikit-learn con la que se entrenó.
    "scikit-learn==1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "kagglehub>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riesgo_credito"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
